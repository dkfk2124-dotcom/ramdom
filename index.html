<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 행운의 번호 뽑기 🎯</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; text-align: center; background-color: #f7f9fc; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 350px; width: 90%; }
        h1 { font-size: 24px; color: #333; margin-bottom: 10px; }
        .desc { color: #666; font-size: 14px; margin-bottom: 20px; }
        .number-box { font-size: 55px; font-weight: bold; color: #2980b9; margin: 20px 0; }
        .loading { color: #007bff; font-size: 20px; }
        .soldout { color: #e74c3c; font-size: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>행운의 번호 추첨</h1>
    <p class="desc">QR을 통해 부여받은 나의 번호는?</p>
    <div id="result" class="number-box loading">추첨 중...</div>
</div>

<script>
    // 본인의 구글 웹 앱 URL 주소를 입력하세요
    const WEB_APP_URL = 'YOUR_WEB_APP_URL_HERE'; 

    window.onload = function() {
        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById('result');
                
                if (data.result === '성공') {
                    resultDiv.className = 'number-box';
                    resultDiv.innerHTML = `🎉 ${data.number}번 🎉<br><span style="font-size:14px; font-weight:normal; color:#555; display:block; margin-top:15px;">이 화면을 스태프에게 보여주세요!</span>`;
                } else if (data.result === '마감') {
                    resultDiv.className = 'number-box soldout';
                    resultDiv.innerHTML = `모든 번호가<br>마감되었습니다! 😢`;
                } else {
                    resultDiv.className = 'number-box soldout';
                    resultDiv.innerText = '오류 발생';
                }
            })
            .catch(error => {
                document.getElementById('result').innerText = '오류가 발생했습니다.';
                console.error(error);
            });
    };
</script>
</body>
</html>
